# Render（https://render.com）の Blueprint。リポジトリをつなぐだけで「ぽかぽか島」が公開される。
services:
  - type: web
    name: pokapoka-island
    runtime: node
    rootDir: village
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Stripe のシークレットキー。Render の画面で入力する（ここには書かない）
      - key: STRIPE_SECRET_KEY
        sync: false
      # カラーパスの値段（円）
      - key: PREMIUM_PRICE_JPY
        value: "300"
      # 島のデータ（アカウント・ポカ・土地）を残す Postgres の接続文字列（Neon など）。Render の画面で入力する
      - key: DATABASE_URL
        sync: false
      # 島ナビ（AI に島のことを聞く）の Claude API キー。Render の画面で入力する。なくても キーワードで答える
      - key: ANTHROPIC_API_KEY
        sync: false
