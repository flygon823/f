<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>月と潮の磯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root {
    --mist-hi: #eef3f2;
    --mist: #d9e3e4;
    --mist-lo: #c3d0d3;
    --ink: #163d40;
    --ink-2: #4b6869;
    --ink-3: #7d9394;
    --tide: #2b6866;
    --tide-2: #6aa6a0;
    --sand: #e3d5b4;
    --panel: rgba(250, 252, 251, 0.9);
    --line: rgba(22, 61, 64, 0.12);
    --shadow: 0 10px 34px rgba(28, 62, 66, 0.14);
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    --dock-h: 40px;
    --controls-h: 190px;
    --bg-hi: #0b1020;
    --bg-mid: #060912;
    --bg-lo: #020307;
    --float-ink: var(--ink);
    --float-ink-2: var(--ink-2);
    --float-ink-3: var(--ink-3);
    color-scheme: light;
  }
  body.dusk {
    --float-ink: #eef3f6;
    --float-ink-2: #c7d3dc;
    --float-ink-3: #9fb0bd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 95% at 50% 38%, var(--bg-hi) 0%, var(--bg-mid) 58%, var(--bg-lo) 100%);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  .brand, .caption, .credit, .species button { transition: color 1.2s ease; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #stage.hovering canvas { cursor: pointer; }

  .underwater {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(120% 90% at 50% 20%, rgba(120, 200, 196, 0.10), rgba(18, 74, 80, 0.42));
    transition: opacity 0.6s ease;
  }
  .underwater.on { opacity: 1; }

  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--tide); outline-offset: 2px; }

  .brand {
    position: fixed; left: 30px; top: calc(26px + env(safe-area-inset-top, 0px));
    pointer-events: none;
  }
  .eyebrow { margin: 0; font-size: 10px; letter-spacing: 0.34em; color: var(--float-ink-2); }
  .brand { color: var(--float-ink); }
  .brand h1 {
    margin: 6px 0 12px; font-family: var(--serif); font-weight: 600;
    font-size: clamp(28px, 3.4vw, 40px); letter-spacing: 0.2em; line-height: 1.1;
  }
  .buy[hidden], .pov[hidden], .povbar[hidden] { display: none; }
  .card-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .card-actions:has(> :not([hidden])) { display: flex; }
  .pov, .buy {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px; cursor: pointer;
    font-size: 11px; font-weight: 500; letter-spacing: 0.05em; text-decoration: none; white-space: nowrap;
  }
  .pov { border: 1px solid var(--tide); background: transparent; color: var(--tide); }
  .pov:hover { background: rgba(43, 104, 102, 0.08); }
  .pov-eye { width: 14px; height: 9px; border: 1.5px solid currentColor; border-radius: 50% / 60%; position: relative; flex: none; }
  .pov-eye::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: currentColor; }
  .povbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--dock-h) + 20px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 999px;
    background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(10px); color: var(--ink); font-size: 12px; letter-spacing: 0.06em; white-space: nowrap;
  }
  .povbar .pov-hint { color: var(--ink-3); font-size: 11px; }
  .rare {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--dock-h) + 20px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 999px; animation: rare-in 0.6s ease;
    background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(10px); color: var(--ink); font-size: 12px; letter-spacing: 0.06em; white-space: nowrap;
  }
  .rare[hidden], body.pov-on .rare { display: none; }
  .rare .rare-mark { color: var(--tide); font-weight: 600; font-size: 11px; }
  .rare button { border: 0; border-radius: 999px; padding: 6px 12px; background: var(--tide); color: #f4faf9; font-size: 11px; cursor: pointer; }
  @keyframes rare-in { from { opacity: 0; transform: translate(-50%, 6px); } }
  .povbar button { border: 0; border-radius: 999px; padding: 7px 14px; background: var(--tide); color: #f4faf9; font-size: 12px; cursor: pointer; }
  @media (max-width: 720px) { .povbar .pov-hint { display: none; } }
  .brand .lede { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: var(--float-ink-2); }

  /* one control stack in the top-right corner: views, then time / tide / season */
  .controls {
    position: fixed; right: 24px; top: calc(22px + env(safe-area-inset-top, 0px)); width: 236px;
    display: grid; gap: 8px; justify-items: end;
  }
  .views {
    display: flex; gap: 2px; padding: 3px; border-radius: 999px;
    background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(10px);
  }
  .views button {
    border: 0; background: transparent; padding: 6px 13px; border-radius: 999px;
    font-size: 11px; letter-spacing: 0.08em; cursor: pointer; color: var(--ink-2);
    transition: background 0.25s, color 0.25s;
  }
  .views button:hover { color: var(--ink); }
  .views button[aria-pressed="true"] { background: var(--tide); color: #f4faf9; }

  .panel {
    width: 100%; padding: 10px 14px; border-radius: 14px; display: grid; gap: 8px;
    background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(10px);
  }
  .panel section { display: grid; gap: 1px; }
  .panel section + section { border-top: 1px solid var(--line); padding-top: 8px; }
  .row-head, .row-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .row-title { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; }
  .row-value { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; white-space: nowrap; }
  .row-value b { font-weight: 500; color: var(--ink); }
  .row-foot { align-items: center; font-size: 10px; color: var(--ink-3); }
  .panel .range { width: 100%; height: 18px; }
  .clock .range::-webkit-slider-runnable-track { background: linear-gradient(90deg, #22314f 0%, #e7b7a4 24%, #e3ebea 36%, #eef2ee 60%, #f0ad7e 76%, #3d4466 84%, #22314f 100%); }
  .clock .range::-moz-range-track { background: linear-gradient(90deg, #22314f 0%, #e7b7a4 24%, #e3ebea 36%, #eef2ee 60%, #f0ad7e 76%, #3d4466 84%, #22314f 100%); }
  .seasons { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 4px; }
  .seasons[hidden] { display: none; }
  .season-label { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .season-btns { display: flex; gap: 2px; }
  .season-btns button { border: 0; background: transparent; border-radius: 999px; padding: 3px 8px; font-size: 11px; cursor: pointer; color: var(--ink-2); }
  .season-btns button[aria-pressed="true"] { background: var(--tide); color: #f4faf9; }
  .caption {
    position: fixed; left: 30px; bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    pointer-events: none; transition: opacity 0.4s, color 1.2s ease; color: var(--float-ink);
  }
  .caption .state { margin: 0 0 10px; font-size: 11px; letter-spacing: 0.22em; color: var(--float-ink-2); }
  .caption .poem {
    margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(18px, 1.9vw, 23px);
    line-height: 1.75; letter-spacing: 0.14em; transition: opacity 0.5s ease;
  }
  .caption .poem.fade { opacity: 0; }

  .dock {
    position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); width: min(560px, calc(100% - 32px));
  }
  .auto {
    border: 0; background: transparent; cursor: pointer; font-size: 10px; font-weight: 500;
    letter-spacing: 0.08em; padding: 2px 0; color: var(--tide);
  }
  .auto[aria-pressed="true"] { color: var(--ink); }
  .auto[aria-pressed="true"]::before { content: "■ "; font-size: 8px; vertical-align: 1px; }
  .auto[aria-pressed="false"]::before { content: "▶ "; font-size: 8px; vertical-align: 1px; }

  .range { -webkit-appearance: none; appearance: none; flex: 1; height: 22px; background: transparent; margin: 0; cursor: pointer; }
  .range::-webkit-slider-runnable-track {
    height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, #dccfa9 0%, #a9d1c9 55%, #2b6866 100%);
  }
  .range::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%;
    background: var(--tide); border: 3px solid #f7faf9; box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
  }
  .range::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, #dccfa9 0%, #a9d1c9 55%, #2b6866 100%); }
  .range::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--tide); border: 3px solid #f7faf9; box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25); }

  .species { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; }
  .members { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; width: fit-content; max-width: 100%; margin: 0 auto 5px; padding: 3px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); }
  .members[hidden] { display: none; }
  .species button, .members button {
    border: 0; background: transparent; cursor: pointer; padding: 3px 6px; border-radius: 6px;
    font-size: 11px; letter-spacing: 0.04em; color: var(--float-ink-2);
  }
  .species button:hover, .members button:hover { color: var(--float-ink); background: rgba(255, 255, 255, 0.18); }
  .species button[aria-pressed="true"], .members button[aria-pressed="true"] { color: var(--ink); background: rgba(255, 255, 255, 0.75); }
  .species button[aria-expanded="true"]:not([aria-pressed="true"]) { color: var(--float-ink); box-shadow: inset 0 -1px 0 currentColor; border-radius: 6px 6px 2px 2px; }

  .card {
    position: fixed; right: 24px; top: calc(var(--controls-h) + 34px + env(safe-area-inset-top, 0px));
    width: 236px; max-height: calc(100% - var(--controls-h) - 110px); overflow-y: auto; padding: 14px 16px 14px; border-radius: 14px;
    background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(12px);
    display: grid; gap: 6px; animation: rise 0.35s ease both;
  }
  .card[hidden], .tip[hidden] { display: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card .close {
    position: absolute; right: 8px; top: 8px; width: 26px; height: 26px; border: 0; border-radius: 50%;
    background: transparent; cursor: pointer; font-size: 16px; color: var(--ink-2);
  }
  .card .close:hover { background: rgba(22, 61, 64, 0.07); }
  .card .kind { margin: 0; font-size: 10px; letter-spacing: 0.24em; color: var(--ink-3); }
  .card h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 17px; letter-spacing: 0.08em; text-wrap: balance; padding-right: 24px; }
  .card .sci { margin: -4px 0 0; font-size: 11px; font-style: italic; color: var(--ink-3); letter-spacing: 0.02em; }
  .card .desc { margin: 0; font-size: 12px; line-height: 1.7; color: var(--ink-2); }
  .card .now { margin: 2px 0 0; padding: 7px 10px; border-radius: 10px; background: rgba(43, 104, 102, 0.08); }
  .card .now span { display: block; font-size: 10px; letter-spacing: 0.2em; color: var(--tide); margin-bottom: 3px; }
  .card .now p { margin: 0; font-size: 11px; line-height: 1.6; color: var(--ink); }
  .card dl { margin: 2px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 11px; }
  .card dt { color: var(--ink-3); letter-spacing: 0.1em; }
  .card dd { margin: 0; color: var(--ink-2); }
  .buy { border: 1px solid var(--tide); background: var(--tide); color: #f4faf9; }
  .buy:hover { background: #235755; }
  .buy::after { content: "↗"; }

  .tip {
    position: fixed; left: 0; top: 0; pointer-events: none; padding: 5px 10px; border-radius: 999px;
    background: rgba(22, 61, 64, 0.86); color: #f2f8f7; font-size: 11px; letter-spacing: 0.06em;
    transform: translate(-50%, -150%); white-space: nowrap;
  }
  .credit {
    position: fixed; left: 30px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    margin: 0; font-size: 10px; color: var(--float-ink-3); letter-spacing: 0.04em; pointer-events: none; max-width: 30ch;
  }

  .loader {
    position: fixed; inset: 0; display: grid; place-items: center; background: #05070d;
    transition: opacity 0.9s ease; z-index: 10;
  }
  .loader.done { opacity: 0; pointer-events: none; }
  .loader p { margin: 0; font-family: var(--serif); font-size: 15px; letter-spacing: 0.3em; color: #c7d3dc; }
  .loader p::after { content: ""; display: block; height: 2px; margin-top: 14px; background: var(--tide-2); transform-origin: left; animation: ebb 1.8s ease-in-out infinite; }
  @keyframes ebb { 0%, 100% { transform: scaleX(0.15); } 50% { transform: scaleX(1); } }

  @media (max-width: 720px) {
    .brand { left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); }
    .brand h1 { font-size: 26px; margin: 4px 0 6px; }
    .brand .lede { font-size: 11px; }
      .controls { right: 16px; left: 16px; width: auto; top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); justify-items: stretch; }
    .views { justify-self: end; }
    .views button { padding: 6px 11px; }
    .dock { bottom: calc(var(--controls-h) + 18px + env(safe-area-inset-bottom, 0px)); }
    .povbar, .rare { bottom: calc(var(--controls-h) + var(--dock-h) + 24px + env(safe-area-inset-bottom, 0px)); }
    .rare { font-size: 11px; gap: 8px; }
    body.has-card .rare { display: none; }
    .caption { left: 16px; right: 16px; bottom: auto; top: calc(128px + env(safe-area-inset-top, 0px)); }
    .caption .state { margin-bottom: 4px; font-size: 10px; }
    .caption .poem { font-size: 15px; line-height: 1.6; }
    .caption .poem br { display: none; }
    body.has-card .caption { opacity: 0; }
    .credit { display: none; }
    .card { right: 16px; left: 16px; width: auto; top: auto; max-height: 42%; bottom: calc(var(--controls-h) + var(--dock-h) + 24px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .loader p::after { animation: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div class="underwater" id="underwater"></div>

<header class="brand">
  <p class="eyebrow" id="eyebrow">MOONLIT TIDEPOOL</p>
  <h1 id="worldName">月と潮の磯</h1>
  <p class="lede" id="lede">月が潮を引くと、小さな世界が現れる。</p>
</header>

<div class="controls" id="controls">
  <nav class="views" aria-label="視点">
    <button type="button" data-view="shore" aria-pressed="true">海辺</button>
    <button type="button" data-view="pools" aria-pressed="false">潮だまり</button>
    <button type="button" data-view="under" aria-pressed="false">水中</button>
  </nav>
  <div class="panel">
    <section class="clock" aria-label="時間帯">
      <div class="row-head"><span class="row-title" id="clockName">昼</span><span class="row-value" id="clockTime">12:00</span></div>
      <input id="tod" class="range" type="range" min="0" max="1439" value="720" aria-label="時刻">
      <div class="seasons" id="seasons" hidden>
        <span class="season-label" id="seasonLabel">秋・9月</span>
        <div class="season-btns" role="group" aria-label="季節（オホーツクの海）">
          <button type="button" data-season="春">春</button><button type="button" data-season="夏">夏</button><button type="button" data-season="秋">秋</button><button type="button" data-season="冬">冬</button>
        </div>
      </div>
    </section>
    <section class="tide" aria-label="潮の満ち引き">
      <div class="row-head"><span class="row-title">潮の満ち引き</span><span class="row-value"><b id="tideState">下げ潮</b> <span class="cm" id="tideCm">潮位 98cm</span></span></div>
      <input id="tide" class="range" type="range" min="0" max="1000" value="520" aria-label="潮位（干潮から満潮）">
      <div class="row-foot"><span>干潮</span><button type="button" id="auto" class="auto" aria-pressed="false">自動で眺める</button><span>満潮</span></div>
    </section>
  </div>
</div>

<section class="caption" aria-live="polite">
  <p class="state"><span id="capTime">昼</span>・<span id="capState">下げ潮</span></p>
  <p class="poem" id="capPoem">隠れていた磯が、<br>少しずつ現れる。</p>
</section>

<div class="dock" id="dock">
  <div class="members" id="members" hidden></div>
  <nav class="species" id="species" aria-label="生き物をさがす"></nav>
</div>

<aside class="card" id="card" hidden aria-live="polite">
  <button type="button" class="close" id="cardClose" aria-label="閉じる">×</button>
  <p class="kind" id="cardKind"></p>
  <h2 id="cardName"></h2>
  <p class="sci" id="cardSci"></p>
  <p class="desc" id="cardDesc"></p>
  <div class="now"><span>いまの様子</span><p id="cardNow"></p></div>
  <dl>
    <dt>大きさ</dt><dd id="cardSize"></dd>
    <dt>すみか</dt><dd id="cardHabitat"></dd>
  </dl>
  <div class="card-actions">
    <button type="button" class="pov" id="cardPov"><span class="pov-eye" aria-hidden="true"></span>目線で見る</button>
    <a class="buy" id="cardBuy" href="https://moonlitprops.booth.pm/" target="_blank" rel="noopener" title="Moonlit Props「磯の生き物 3D セット」（FBX / GLB / Blender）">3D モデル（BOOTH）</a>
  </div>
</aside>

<div class="povbar" id="povbar" hidden>
  <span class="pov-eye" aria-hidden="true"></span>
  <span id="povName">マダコの目線</span>
  <span class="pov-hint">ドラッグで見回す</span>
  <button type="button" id="povExit">もとにもどる</button>
</div>
<div class="rare" id="rare" role="status" hidden>
  <span class="rare-mark" id="rareMark">めずらしい！</span>
  <span id="rareText">ザトウクジラが姿を見せました</span>
  <button type="button" id="rareGo">見にいく</button>
</div>
<div class="tip" id="tip" hidden></div>
<p class="credit">ドラッグで回転・スクロールで拡大。生き物は見やすい大きさに変えています。</p>
<div class="loader" id="loader"><p id="loaderText">月と潮の磯をひらいています</p></div>

<script>
  setTimeout(function () {
    var l = document.getElementById('loader');
    if (l && !l.classList.contains('done')) document.getElementById('loaderText').textContent = '読み込みに時間がかかっています…';
  }, 12000);
</script>
<script type="module">
import * as THREE from 'three';
import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------ utils */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function smooth(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);

{

// Each creature above has two close relatives living alongside it. Their builders are
// the same ones, recoloured or reshaped, and they move the same way.
function recolor(root, map) {
  const done = new Map();
  root.traverse((m) => {
    if (!m.isMesh || !m.material || !m.material.color) return;
    const to = map['#' + m.material.color.getHexString()];
    if (!to) return;
    if (!done.has(m.material)) { const c = m.material.clone(); c.color.set(to); done.set(m.material, c); }
    m.material = done.get(m.material);
  });
  return root;
}
// n spots inside a zone where ok(x, z) holds, from the seeded random so the layout keeps
function spotsIn(n, cx, cz, r, ok) {
  const out = [];
  for (let i = 0; i < 600 && out.length < n; i++) {
    const a = sr(0, TAU), d = Math.sqrt(srand()) * r, x = cx + Math.cos(a) * d, z = cz + Math.sin(a) * d;
    if (ok(x, z)) out.push([x, z]);
  }
  return out;
}

// Local frame of iceSide: same slab outline and tide as the shore, but a snowy
// coast at the back and deep, cold water with drifting floes in front.
const ISLET = { x: 6.2, z: 3.2 };
function iceHeight(x, z) {
  const shore = z + Math.sin(x * 0.33 + 1.2) * 1.1 + (vnoise(x * 0.4 + 20, 3) - 0.5) * 0.8;
  let h = lerp(2.3, -3.1, smooth(-5.2, -1.2, shore)) + (fbm(x * 0.35 + 40, z * 0.35 + 9) - 0.5) * 0.5;
  const g = Math.exp(-(((x - ISLET.x) ** 2) / 2.2 + ((z - ISLET.z) ** 2) / 1.8));
  h = lerp(h, Math.max(h, 1.15 + (fbm(x * 1.2, z * 1.2) - 0.5) * 0.3), smooth(0.25, 0.6, g));
  return rimBlend(x, z, h);
}

// Seasons. Only the Okhotsk side (Hokkaido) has four seasons; the southern shore stays
// the same all year. yearT runs 0..1 from 1 January and starts at today's date.
const today = new Date();
let yearT = ((today - new Date(today.getFullYear(), 0, 1)) / 86400000) / 365;
const monthOf = () => ((yearT % 1) + 1) % 1 * 12;             // 0 = start of January
const seasonName = (m) => (m < 2 || m >= 11 ? '冬' : m < 5 ? '春' : m < 8 ? '夏' : '秋');
const SEASON_MID = { 春: 4.2, 夏: 6.6, 秋: 9.4, 冬: 1.4 };       // month used by the season buttons
const GROUND_KEYS = [[0, '#a79a74'], [3.6, '#a79a74'], [4.5, '#9dbe70'], [6.5, '#79a55c'], [8.6, '#80a35a'], [9.6, '#b5a064'], [11, '#a79a74'], [12, '#a79a74']]
  .map(([m, c]) => [m, new THREE.Color(c)]);
const SEASON = { m: 0, snow: 1, ice: 1, leaf: 0, bloom: 0, autumn: 0, berries: 0, roseLeaf: 0, roseFlower: 0, hips: 0, ground: new THREE.Color() };
function computeSeason() {
  const m = monthOf();
  SEASON.m = m;
  SEASON.snow = Math.max(1 - smooth(2.8, 4.0, m), smooth(10.4, 11.4, m));
  SEASON.ice = smooth(0.3, 1.1, m) * (1 - smooth(2.7, 3.5, m));          // drift ice: February-March
  SEASON.leaf = smooth(3.9, 4.7, m) * (1 - smooth(10.1, 10.8, m));
  SEASON.bloom = smooth(3.7, 4.05, m) * (1 - smooth(4.45, 4.85, m));      // Ezo mountain cherry: early May
  SEASON.autumn = smooth(8.6, 9.5, m);
  SEASON.berries = Math.max(smooth(8.3, 8.9, m), 1 - smooth(2.6, 3.2, m));
  SEASON.roseLeaf = smooth(4.3, 4.9, m) * (1 - smooth(9.8, 10.4, m));
  SEASON.roseFlower = smooth(5.2, 5.7, m) * (1 - smooth(7.8, 8.3, m));
  SEASON.hips = smooth(7.9, 8.4, m) * (1 - smooth(9.9, 10.4, m));
  let i = 0;
  while (GROUND_KEYS[i + 1][0] <= m) i++;
  const [ma, ca] = GROUND_KEYS[i], [mb, cb] = GROUND_KEYS[i + 1];
  SEASON.ground.lerpColors(ca, cb, smooth(0, 1, (m - ma) / (mb - ma)));
}

const floes = [];

for (let n = 0, tries = 0; n < 15 && tries < 800; tries++) {

  const mesh = new THREE.Mesh(floeGeo(r, n + 1), floeMat);
  mesh.castShadow = mesh.receiveShadow = true;
  const f = { mesh, x, z, r, vx: 0, vz: 0, rot: sr(0, TAU), spin: sr(-0.02, 0.02), ph: sr(0, TAU), y: tideY, grounded: false };

for (let n = 0, tries = 0; n < 3 && tries < 800; tries++) {

// A slow anticlockwise gyre fills the bay; the floes and the streaks on the water follow it.
const GYRE = { x: -0.5, z: 4.2 };

function updateFloes(dt, t) {

    const k = Math.min(1, dt * 0.35);
    f.vx += (flowTmp.x - f.vx) * k;

    const nx = f.x + f.vx * dt, nz = f.z + f.vz * dt;
    if (!f.home && iceHeight(nx, nz) + 0.26 > tideY + 0.05 && !f.grounded) { f.vx *= -0.3; f.vz *= -0.3; }

    f.rot += (f.spin + 0.02) * dt * (f.grounded ? 0 : 1);

}

    if (!m.isMesh || m.material === proxyMat || !m.visible || !m.geometry.attributes.position) return;

function openYaw(eye, fwd, up) {

// dock height for the mobile card placement
new ResizeObserver(() => document.documentElement.style.setProperty('--dock-h', $('dock').offsetHeight + 'px')).observe($('dock'));

window.addEventListener('resize', onResize);

/* ------------------------------------------------------------------ loop */
fitFov();
{
  const { pos, target } = shorePose();
  controls.target.copy(target);
  if (reduceMotion) camera.position.copy(pos);
  else {
    camera.position.copy(target).addScaledVector(pos.clone().sub(target), 1.5).add(new THREE.Vector3(0, 6, 0));
    flyTo(pos, target, 2.8);
  }
  tiltRef.d0 = pos.distanceTo(PLANET_C);
}
let camUnder = false;
const clock = new THREE.Clock();
