<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>月と潮の磯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root {
    --mist-hi: #eef3f2;
    --mist: #d9e3e4;
    --mist-lo: #c3d0d3;
    --ink: #163d40;
    --ink-2: #4b6869;
    --ink-3: #7d9394;
    --tide: #2b6866;
    --tide-2: #6aa6a0;
    --sand: #e3d5b4;
    --panel: rgba(250, 252, 251, 0.9);
    --line: rgba(22, 61, 64, 0.12);
    --shadow: 0 10px 34px rgba(28, 62, 66, 0.14);
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    --dock-h: 150px;
    --bg-hi: var(--mist-hi);
    --bg-mid: var(--mist);
    --bg-lo: var(--mist-lo);
    --float-ink: var(--ink);
    --float-ink-2: var(--ink-2);
    --float-ink-3: var(--ink-3);
    color-scheme: light;
  }
  body.dusk {
    --float-ink: #eef3f6;
    --float-ink-2: #c7d3dc;
    --float-ink-3: #9fb0bd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 95% at 50% 38%, var(--bg-hi) 0%, var(--bg-mid) 58%, var(--bg-lo) 100%);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; }
  .brand, .caption, .credit, .species button { transition: color 1.2s ease; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  #stage.hovering canvas { cursor: pointer; }

  .underwater {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(120% 90% at 50% 20%, rgba(120, 200, 196, 0.10), rgba(18, 74, 80, 0.42));
    transition: opacity 0.6s ease;
  }
  .underwater.on { opacity: 1; }

  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--tide); outline-offset: 2px; }

  .brand {
    position: fixed; left: 30px; top: calc(26px + env(safe-area-inset-top, 0px));
    pointer-events: none;
  }
  .eyebrow { margin: 0; font-size: 10px; letter-spacing: 0.34em; color: var(--float-ink-2); }
  .brand { color: var(--float-ink); }
  .brand h1 {
    margin: 6px 0 12px; font-family: var(--serif); font-weight: 600;
    font-size: clamp(28px, 3.4vw, 40px); letter-spacing: 0.2em; line-height: 1.1;
  }
  .flip {
    pointer-events: auto; margin-top: 14px; display: inline-flex; align-items: center; gap: 8px;
    border: 0; border-radius: 999px; padding: 7px 14px 7px 10px; cursor: pointer;
    background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(10px);
    font-size: 12px; letter-spacing: 0.06em; color: var(--ink);
  }
  .flip:hover { background: #ffffff; }
  .flip-icon { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--tide); color: #f4faf9; font-size: 13px; }
  .flip:disabled { opacity: 0.6; cursor: default; }
  .buy[hidden] { display: none; }
  .brand .lede { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: var(--float-ink-2); }

  .views {
    position: fixed; right: 26px; top: calc(24px + env(safe-area-inset-top, 0px));
    display: flex; gap: 2px; padding: 4px; border-radius: 999px;
    background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(10px);
  }
  .views button {
    border: 0; background: transparent; padding: 8px 15px; border-radius: 999px;
    font-size: 12px; letter-spacing: 0.08em; cursor: pointer; color: var(--ink-2);
    transition: background 0.25s, color 0.25s;
  }
  .views button:hover { color: var(--ink); }
  .views button[aria-pressed="true"] { background: var(--tide); color: #f4faf9; }

  .clock {
    position: fixed; right: 26px; top: calc(76px + env(safe-area-inset-top, 0px));
    width: 216px; padding: 10px 14px 6px; border-radius: 14px;
    background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(10px);
    display: grid; gap: 2px;
  }
  .clock-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .clock-name { font-size: 12px; font-weight: 500; letter-spacing: 0.12em; }
  .clock-time { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .clock .range::-webkit-slider-runnable-track { background: linear-gradient(90deg, #22314f 0%, #e7b7a4 24%, #e3ebea 36%, #eef2ee 60%, #f0ad7e 76%, #3d4466 84%, #22314f 100%); }
  .clock .range::-moz-range-track { background: linear-gradient(90deg, #22314f 0%, #e7b7a4 24%, #e3ebea 36%, #eef2ee 60%, #f0ad7e 76%, #3d4466 84%, #22314f 100%); }
  .clock .range { width: 100%; }
  .caption {
    position: fixed; left: 30px; bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    pointer-events: none; transition: opacity 0.4s, color 1.2s ease; color: var(--float-ink);
  }
  .caption .state { margin: 0 0 10px; font-size: 11px; letter-spacing: 0.22em; color: var(--float-ink-2); }
  .caption .poem {
    margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(18px, 1.9vw, 23px);
    line-height: 1.75; letter-spacing: 0.14em; transition: opacity 0.5s ease;
  }
  .caption .poem.fade { opacity: 0; }

  .dock {
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); width: min(460px, calc(100% - 32px));
    display: grid; gap: 10px; justify-items: center;
  }
  .tide {
    width: 100%; padding: 14px 20px 12px; border-radius: 16px;
    background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(12px);
    display: grid; gap: 6px;
  }
  .tide-head, .tide-foot, .tide-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tide-title { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; }
  .tide-state { display: flex; align-items: baseline; gap: 10px; font-size: 11px; color: var(--ink-2); }
  .tide-state b { font-weight: 500; color: var(--ink); letter-spacing: 0.1em; }
  .tide-state .cm { font-variant-numeric: tabular-nums; }
  .tide-row span { font-size: 11px; color: var(--ink-2); white-space: nowrap; }
  .tide-foot .hint { font-size: 10px; color: var(--ink-3); letter-spacing: 0.04em; }
  .auto {
    border: 0; background: transparent; cursor: pointer; font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; padding: 4px 0; color: var(--tide);
  }
  .auto[aria-pressed="true"] { color: var(--ink); }
  .auto[aria-pressed="true"]::before { content: "■ "; font-size: 8px; vertical-align: 1px; }
  .auto[aria-pressed="false"]::before { content: "▶ "; font-size: 8px; vertical-align: 1px; }

  .range { -webkit-appearance: none; appearance: none; flex: 1; height: 22px; background: transparent; margin: 0; cursor: pointer; }
  .range::-webkit-slider-runnable-track {
    height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, #dccfa9 0%, #a9d1c9 55%, #2b6866 100%);
  }
  .range::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%;
    background: var(--tide); border: 3px solid #f7faf9; box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
  }
  .range::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, #dccfa9 0%, #a9d1c9 55%, #2b6866 100%); }
  .range::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--tide); border: 3px solid #f7faf9; box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25); }

  .species { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; }
  .species button {
    border: 0; background: transparent; cursor: pointer; padding: 3px 6px; border-radius: 6px;
    font-size: 11px; letter-spacing: 0.04em; color: var(--float-ink-2);
  }
  .species button:hover { color: var(--float-ink); background: rgba(255, 255, 255, 0.18); }
  .species button[aria-pressed="true"] { color: var(--ink); background: rgba(255, 255, 255, 0.75); }

  .card {
    position: fixed; right: 26px; bottom: calc(150px + env(safe-area-inset-bottom, 0px));
    width: min(320px, calc(100% - 32px)); padding: 18px 20px 16px; border-radius: 16px;
    background: var(--panel); box-shadow: var(--shadow); backdrop-filter: blur(12px);
    display: grid; gap: 8px; animation: rise 0.35s ease both;
  }
  .card[hidden], .tip[hidden] { display: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card .close {
    position: absolute; right: 10px; top: 10px; width: 28px; height: 28px; border: 0; border-radius: 50%;
    background: transparent; cursor: pointer; font-size: 16px; color: var(--ink-2);
  }
  .card .close:hover { background: rgba(22, 61, 64, 0.07); }
  .card .kind { margin: 0; font-size: 10px; letter-spacing: 0.24em; color: var(--ink-3); }
  .card h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 19px; letter-spacing: 0.08em; text-wrap: balance; padding-right: 24px; }
  .card .sci { margin: -4px 0 0; font-size: 11px; font-style: italic; color: var(--ink-3); letter-spacing: 0.02em; }
  .card .desc { margin: 0; font-size: 13px; line-height: 1.75; color: var(--ink-2); }
  .card .now { margin: 2px 0 0; padding: 9px 11px; border-radius: 10px; background: rgba(43, 104, 102, 0.08); }
  .card .now span { display: block; font-size: 10px; letter-spacing: 0.2em; color: var(--tide); margin-bottom: 3px; }
  .card .now p { margin: 0; font-size: 12px; line-height: 1.65; color: var(--ink); }
  .card dl { margin: 2px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 11px; }
  .card dt { color: var(--ink-3); letter-spacing: 0.1em; }
  .card dd { margin: 0; color: var(--ink-2); }
  .buy {
    margin-top: 4px; display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px;
    background: var(--tide); color: #f4faf9; text-decoration: none;
  }
  .buy:hover { background: #235755; }
  .buy b { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; }
  .buy b::after { content: " ↗"; }
  .buy span { font-size: 10px; opacity: 0.85; letter-spacing: 0.04em; }

  .tip {
    position: fixed; left: 0; top: 0; pointer-events: none; padding: 5px 10px; border-radius: 999px;
    background: rgba(22, 61, 64, 0.86); color: #f2f8f7; font-size: 11px; letter-spacing: 0.06em;
    transform: translate(-50%, -150%); white-space: nowrap;
  }
  .credit {
    position: fixed; left: 30px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    margin: 0; font-size: 10px; color: var(--float-ink-3); letter-spacing: 0.04em; pointer-events: none; max-width: 30ch;
  }

  .loader {
    position: fixed; inset: 0; display: grid; place-items: center; background: var(--mist);
    transition: opacity 0.9s ease; z-index: 10;
  }
  .loader.done { opacity: 0; pointer-events: none; }
  .loader p { margin: 0; font-family: var(--serif); font-size: 15px; letter-spacing: 0.3em; color: var(--ink-2); }
  .loader p::after { content: ""; display: block; height: 2px; margin-top: 14px; background: var(--tide-2); transform-origin: left; animation: ebb 1.8s ease-in-out infinite; }
  @keyframes ebb { 0%, 100% { transform: scaleX(0.15); } 50% { transform: scaleX(1); } }

  @media (max-width: 720px) {
    .brand { left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); }
    .brand h1 { font-size: 26px; margin: 4px 0 6px; }
    .brand .lede { font-size: 11px; }
    .flip { margin-top: 8px; padding: 6px 12px 6px 8px; font-size: 11px; }
    .views { right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); }
    .views button { padding: 7px 11px; font-size: 11px; }
    .clock { right: 16px; top: calc(64px + env(safe-area-inset-top, 0px)); width: 150px; padding: 8px 11px 4px; }
    .clock-name, .clock-time { font-size: 11px; }
    .caption { left: 16px; bottom: auto; top: calc(150px + env(safe-area-inset-top, 0px)); }
    .caption .poem { font-size: 16px; line-height: 1.65; }
    .caption .state { margin-bottom: 4px; }
    body.has-card .caption { opacity: 0; }
    .card { right: 16px; left: 16px; width: auto; bottom: calc(var(--dock-h) + 22px + env(safe-area-inset-bottom, 0px)); }
    .credit { display: none; }
    .tide { padding: 12px 16px 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .loader p::after { animation: none; }
  }
</style>

} }

<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="stage"></div>
<div class="underwater" id="underwater"></div>

<header class="brand">
  <p class="eyebrow" id="eyebrow">MOONLIT TIDEPOOL</p>
  <h1 id="worldName">月と潮の磯</h1>
  <p class="lede" id="lede">月が潮を引くと、小さな世界が現れる。</p>
  <button type="button" class="flip" id="flip"><span class="flip-icon" aria-hidden="true">↻</span><span id="flipLabel">裏返す・流氷の海へ</span></button>
</header>

<nav class="views" aria-label="視点">
  <button type="button" data-view="shore" aria-pressed="true">海辺</button>
  <button type="button" data-view="pools" aria-pressed="false">潮だまり</button>
  <button type="button" data-view="under" aria-pressed="false">水中</button>
</nav>

<section class="clock" aria-label="時間帯">
  <div class="clock-head"><span class="clock-name" id="clockName">昼</span><span class="clock-time" id="clockTime">12:00</span></div>
  <input id="tod" class="range" type="range" min="0" max="1439" value="720" aria-label="時刻">
</section>

<section class="caption" aria-live="polite">
  <p class="state"><span id="capTime">昼</span>・<span id="capState">下げ潮</span></p>
  <p class="poem" id="capPoem">隠れていた磯が、<br>少しずつ現れる。</p>
</section>

<div class="dock" id="dock">
  <section class="tide" aria-label="潮の満ち引き">
    <div class="tide-head">
      <span class="tide-title">潮の満ち引き</span>
      <span class="tide-state"><b id="tideState">下げ潮</b><span class="cm" id="tideCm">潮位 98cm</span></span>
    </div>
    <div class="tide-row">
      <span>干潮</span>
      <input id="tide" class="range" type="range" min="0" max="1000" value="520" aria-label="潮位（干潮から満潮）">
      <span>満潮</span>
    </div>
    <div class="tide-foot">
      <span class="hint">ドラッグで回転・スクロールで拡大</span>
      <button type="button" id="auto" class="auto" aria-pressed="false">自動で眺める</button>
    </div>
  </section>
  <nav class="species" id="species" aria-label="生き物をさがす"></nav>
</div>

<aside class="card" id="card" hidden aria-live="polite">
  <button type="button" class="close" id="cardClose" aria-label="閉じる">×</button>
  <p class="kind" id="cardKind"></p>
  <h2 id="cardName"></h2>
  <p class="sci" id="cardSci"></p>
  <p class="desc" id="cardDesc"></p>
  <div class="now"><span>いまの様子</span><p id="cardNow"></p></div>
  <dl>
    <dt>大きさ</dt><dd id="cardSize"></dd>
    <dt>すみか</dt><dd id="cardHabitat"></dd>
  </dl>
  <a class="buy" id="cardBuy" href="https://moonlitprops.booth.pm/" target="_blank" rel="noopener">
    <b>この 3D モデルを BOOTH で見る</b>
    <span>Moonlit Props「磯の生き物 3D セット」（FBX / GLB / Blender）</span>
  </a>
</aside>

<div class="tip" id="tip" hidden></div>
<p class="credit">日本の磯をもとにした箱庭です。生き物は見やすい大きさに変えています。</p>
<div class="loader" id="loader"><p id="loaderText">月と潮の磯をひらいています</p></div>

<script>
  setTimeout(function () {
    var l = document.getElementById('loader');
    if (l && !l.classList.contains('done')) document.getElementById('loaderText').textContent = '読み込みに時間がかかっています…';
  }, 12000);
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------ utils */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function smooth(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) { let f = 0, a = 0.5; for (let i = 0; i < 4; i++) { f += a * vnoise(x, y); x *= 2.03; y *= 2.03; a *= 0.5; } return f / 0.9375; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const srand = mulberry32(20260917);
const sr = (a, b) => a + (b - a) * srand();
const rr = (a, b) => a + (b - a) * Math.random();
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function turnTo(a, b, max) { return a + clamp(angDiff(b, a), -max, max); }
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------ world shape */
const A = 12, B = 9, SE = 4, BOTTOM = -4.2, WATER_BOTTOM = -3.6;
const TIDE_LOW = -0.95, TIDE_HIGH = 1.8;
const POOLS = [
  { x: -3.4, z: 0.2, r: 2.3, rim: 1.38, floor: 0.22, level: 1.05, seed: 1 },
  { x: 1.9, z: 2.4, r: 1.8, rim: 1.22, floor: 0.12, level: 0.9, seed: 2 },
];
const BIG_ROCK = { x: 7.6, z: -0.6 };

const seF = (x, z) => Math.pow(Math.abs(x / A), SE) + Math.pow(Math.abs(z / B), SE);
function boundaryAt(th) {
  const c = Math.cos(th), s = Math.sin(th);
  return [A * Math.sign(c) * Math.pow(Math.abs(c), 2 / SE), B * Math.sign(s) * Math.pow(Math.abs(s), 2 / SE)];
}
function poolQ(p, x, z) {
  const dx = x - p.x, dz = z - p.z, d = Math.hypot(dx, dz), a = Math.atan2(dz, dx);
  const rn = p.r * (1 + (vnoise(Math.cos(a) * 1.4 + p.seed * 9.1, Math.sin(a) * 1.4 + p.seed * 3.7) - 0.5) * 0.16);
  return d / rn;
}
const bowlH = (p, q) => p.floor + (p.rim - p.floor) * Math.pow(smooth(0.08, 1.0, q), 1.5);

function sample(x, z) {
  const d = z * 0.85 - x * 0.3;
  let h = 2.5 - 4.5 * smooth(-5.5, 6.8, d) + (fbm(x * 0.32 + 3.1, z * 0.32 - 1.7) - 0.5) * 0.45;
  let rock = 0;
  const sh = Math.exp(-(((x + 0.5) / 5) ** 2 + ((z - 0.8) / 3.2) ** 2));
  const ws = smooth(0.3, 0.62, sh);
  if (ws > 0) { const shelf = 1.0 + (fbm(x * 0.9, z * 0.9) - 0.5) * 0.4; h = lerp(h, Math.max(h, shelf), ws); rock = ws; }
  const gr = Math.exp(-(((x - BIG_ROCK.x) ** 2) / 7 + ((z - BIG_ROCK.z) ** 2) / 6));
  const wr = smooth(0.25, 0.7, gr);
  if (wr > 0) { h = lerp(h, Math.max(h, 1.8), wr); rock = Math.max(rock, wr); }
  const qs = POOLS.map(p => poolQ(p, x, z));

const sphereGeo = new THREE.SphereGeometry(1, 18, 14);

const segCache = new Map();
function segGeo(r, l) {
  const k = r.toFixed(3) + '_' + l.toFixed(3);
  if (!segCache.has(k)) { const g = new THREE.CylinderGeometry(r * 0.8, r, l, 6); g.rotateZ(-Math.PI / 2); g.translate(l / 2, 0, 0); segCache.set(k, g); }
  return segCache.get(k);
}
function makeLeg(m1, m2, l1, l2, r) {
  const root = new THREE.Group(), knee = new THREE.Group();
  root.add(new THREE.Mesh(segGeo(r, l1), m1));
  knee.position.x = l1;
  root.add(knee);
  knee.add(new THREE.Mesh(segGeo(r * 0.8, l2), m2));
  return { root, knee };
}
function blob(parent, mat, x, y, z, sx, sy = sx, sz = sx) {
  const m = new THREE.Mesh(sphereGeo, mat);
  m.position.set(x, y, z); m.scale.set(sx, sy, sz);

}

function makeOctopus() {

    blob(body, pap, Math.cos(a) * Math.sin(b) * 0.39, 0.8 + Math.cos(b) * 0.46, -0.3 + Math.sin(a) * Math.sin(b) * 0.44, 0.035);

    pu.rotation.y = s * 0.7;

  const geos = [];

    const r = lerp(0.1, 0.028, j / (SEGS - 1));
    const cg = new THREE.CapsuleGeometry(r, LEN * 0.9, 3, 8);

function makeHermit() {

const floes = [];
function floeGeo(r, seed) {
  const n = 18, s = new THREE.Shape(), stretch = 0.75 + (seed % 4) * 0.15;
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU + (hash2(seed, i) - 0.5) * 0.25;
    const rad = r * (0.55 + 0.6 * fbm(Math.cos(a) * 1.1 + seed * 7.3, Math.sin(a) * 1.1 + seed * 3.1));
    const px = Math.cos(a) * rad * stretch, py = Math.sin(a) * rad / stretch;
    i ? s.lineTo(px, py) : s.moveTo(px, py);
  }
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.3, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.09, bevelSegments: 2, curveSegments: 4 });
  g.rotateX(-Math.PI / 2);
  g.translate(0, -0.2, 0);
  const nrm = g.attributes.normal, cols = [], top = new THREE.Color('#f5f9fb'), side = new THREE.Color('#b5d7e3');
  for (let i = 0; i < nrm.count; i++) { const c = nrm.getY(i) > 0.6 ? top : side; cols.push(c.r, c.g, c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  return g;
}
const floeMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, metalness: 0 });
for (let n = 0, tries = 0; n < 15 && tries < 800; tries++) {
  const r = n < 3 ? sr(1.4, 1.8) : sr(0.6, 1.4);

  if (floes.some(f => Math.hypot(f.x - x, f.z - z) < f.r + r + 0.25)) continue;
  const mesh = new THREE.Mesh(floeGeo(r, n + 1), floeMat);
  mesh.castShadow = mesh.receiveShadow = true;
  const f = { mesh, x, z, r, vx: 0, vz: 0, rot: sr(0, TAU), spin: sr(-0.02, 0.02), ph: sr(0, TAU), y: tideY, grounded: false };

for (let n = 0, tries = 0; n < 3 && tries < 800; tries++) {
  const x = sr(-9, 3), z = sr(-4.5, -1.5), h = iceHeight(x, z), r = sr(0.6, 0.95);
  if (seF(x, z) > 0.7 || h < -0.7 || h > 0.4) continue;
  if (floes.some(f => Math.hypot(f.x - x, f.z - z) < f.r + r + 0.3)) continue;
  const mesh = new THREE.Mesh(floeGeo(r, 40 + n), floeMat);
  mesh.castShadow = mesh.receiveShadow = true;
  const f = { mesh, x, z, r, vx: 0, vz: 0, rot: sr(0, TAU), spin: sr(-0.02, 0.02), ph: sr(0, TAU), y: Math.max(tideY, h + 0.26), grounded: false, home: { x, z } };
  mesh.position.set(x, f.y, z);
  iceSide.add(mesh);
  floes.push(f);

}
function updateFloes(dt, t) {
  for (const f of floes) {
    // a slow, wandering current plus a little push away from the edge and the beach
    f.vx += (Math.sin(t * 0.05 + f.ph) * 0.02 - f.x * 0.0015) * dt;
    f.vz += (Math.cos(t * 0.04 + f.ph * 1.7) * 0.02 - (f.z - 2.5) * 0.0015) * dt;
    for (const o of floes) {
      if (o === f) continue;
      const dx = f.x - o.x, dz = f.z - o.z, d = Math.hypot(dx, dz), min = f.r + o.r + 0.1;
      if (d < min && d > 1e-4) { const k = (min - d) * 0.6 * dt; f.vx += dx / d * k; f.vz += dz / d * k; }
    }
    if (seF(f.x, f.z) > 0.6) { f.vx -= f.x * 0.01 * dt; f.vz -= f.z * 0.01 * dt; }
    if (f.home) { f.vx += (f.home.x - f.x) * 0.02 * dt; f.vz += (f.home.z - f.z) * 0.02 * dt; }
    const floor = iceHeight(f.x, f.z);
    f.grounded = floor + 0.26 > tideY;
    const damp = f.grounded ? 0.8 : 0.995;
    f.vx *= Math.pow(damp, dt * 60); f.vz *= Math.pow(damp, dt * 60);
    const nx = f.x + f.vx * dt * 6, nz = f.z + f.vz * dt * 6;
    if (!f.home && iceHeight(nx, nz) + 0.26 > tideY + 0.05 && !f.grounded) { f.vx *= -0.3; f.vz *= -0.3; }
    else { f.x = nx; f.z = nz; }
    const bob = f.grounded ? 0 : Math.sin(t * 0.9 + f.ph) * 0.025;
    const want = Math.max(tideY + bob, floor + 0.26);
    f.y += (want - f.y) * Math.min(1, dt * 2);
    f.rot += f.spin * dt * (f.grounded ? 0 : 1);
    f.mesh.position.set(f.x, f.y, f.z);
    f.mesh.rotation.set(f.grounded ? 0.03 : Math.sin(t * 0.7 + f.ph) * 0.012, f.rot, f.grounded ? -0.02 : Math.cos(t * 0.6 + f.ph) * 0.012);
  }
}

  controls.target.copy(target);
  if (reduceMotion) camera.position.copy(pos);
  else {
    camera.position.copy(target).addScaledVector(pos.clone().sub(target), 1.5).add(new THREE.Vector3(0, 6, 0));
    flyTo(pos, target, 2.8);
  }
}
let camUnder = false;
const clock = new THREE.Clock();
const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const followDelta = new THREE.Vector3(), selWorld = new THREE.Vector3(), selLocal = new THREE.Vector3();
const viewOff = { x: 0, y: 0 };

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // tide
  if (autoMode) { autoPhase += dt * TAU / 44; tn = 0.5 - 0.5 * Math.cos(autoPhase); }
  else if (tideAnim) {
    tideAnim.t += dt / tideAnim.dur;
    tn = lerp(tideAnim.from, tideAnim.to, easeInOut(Math.min(1, tideAnim.t)));
    if (tideAnim.t >= 1) tideAnim = null;
  }
  if (Math.abs(tn - lastTn) > 1e-5) tideDir = tn > lastTn ? 1 : -1;
  lastTn = tn;
  tideY = lerp(TIDE_LOW, TIDE_HIGH, tn);
  U.uTide.value = tideY;
  U.uTime.value = t;
  sea.scale.y = tideY - WATER_BOTTOM;
  iceSea.scale.y = tideY - WATER_BOTTOM;
  if (flipAnim) {
    flipAnim.t += dt / flipAnim.dur;
    flipGroup.rotation.z = lerp(flipAnim.from, flipAnim.to, easeInOut(Math.min(1, flipAnim.t)));
    if (flipAnim.t >= 1) { flipAnim = null; $('flip').disabled = false; }
  }
  flipF = flipGroup.rotation.z / Math.PI;
  flipGroup.updateMatrixWorld(true);
  SHORE_U.uSideInv.value.copy(shoreSide.matrixWorld).invert();
  ICE_U.uSideInv.value.copy(iceSide.matrixWorld).invert();
  const shoreLive = flipF < 0.999, iceLive = flipF > 0.001;
  poolDiscs.forEach((d, i) => { d.visible = tideY < POOLS[i].level - 0.005; });
  waterNormal.offset.set(t * 0.012, t * 0.008);
  updateDay(dt);

  // creatures
  if (iceLive) updateFloes(dt, t);
  snow.visible = flipF > 0.6;
  if (snow.visible) updateSnow(dt, t);
  for (const ind of inds) {
    if (!(ind.sideName === 'ice' ? iceLive : shoreLive)) continue;
    if (ind.react > 0) ind.react -= dt;
    if (ind.school) continue;
    if (ind.fixed) { ind.update(ind, dt, t); continue; }
    stepWalker(ind, dt);
    ind.group.position.set(ind.x, heightAt(ind.x, ind.z) + ind.yOff, ind.z);
    ind.group.rotation.y = ind.yaw;
    ind.anim(ind, dt, t);
  }
  if (shoreLive) updateSchool(dt, t);

  // selection
  if (sel) {
    const p = sel.group.getWorldPosition(selWorld);
    const lp = sideGroup(sel.sideName).worldToLocal(selLocal.copy(p));
    ring.position.set(lp.x, sel.ringY ? sel.ringY(lp) : heightOnSide(sel.sideName)(lp.x, lp.z) + 0.03, lp.z);
    ring.scale.setScalar(sel.pick * 1.25 * (1 + Math.sin(t * 3) * 0.05));
    ring.material.opacity = 0.55 + Math.sin(t * 3) * 0.25;
    if (!camAnim) {
      followDelta.set(p.x, p.y + 0.15, p.z).sub(controls.target).multiplyScalar(Math.min(1, dt * 2.5));
      controls.target.add(followDelta);
      camera.position.add(followDelta);
    }
    statusTimer -= dt;
    if (statusTimer <= 0) { statusTimer = 0.4; $('cardNow').textContent = SPECIES[sel.species].status(sel); }
  }

  // camera
  if (camAnim) {
    camAnim.t += dt / camAnim.dur;
    const e = easeInOut(Math.min(1, camAnim.t));
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();

  // keep the selected creature clear of the info card
  const narrow = window.innerWidth <= 720;
  const wantX = sel && !narrow ? Math.min(ui.card.offsetWidth * 0.5, window.innerWidth * 0.18) : 0;
  const wantY = sel && narrow ? ui.card.offsetHeight * 0.5 + 16 : 0;
  viewOff.x += (wantX - viewOff.x) * Math.min(1, dt * 4);
  viewOff.y += (wantY - viewOff.y) * Math.min(1, dt * 4);
  if (Math.abs(viewOff.x) + Math.abs(viewOff.y) > 0.5) {
    camera.setViewOffset(window.innerWidth, window.innerHeight, viewOff.x, viewOff.y, window.innerWidth, window.innerHeight);
  } else if (camera.view && camera.view.enabled) camera.clearViewOffset();

  const cp = sideGroup(side).worldToLocal(selLocal.copy(camera.position));
  const wl = side === 'ice' ? tideY : waterLevelAt(cp.x, cp.z);
  camUnder = !flipAnim && seF(cp.x, cp.z) < 1 && cp.y < wl - 0.02 && cp.y > heightOnSide(side)(cp.x, cp.z);
  scene.fog.near = camUnder ? 0.5 : 400;
  scene.fog.far = camUnder ? 17 : 1000;
  ui.under.classList.toggle('on', camUnder);

  updateTideUI();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);
requestAnimationFrame(() => requestAnimationFrame(() => $('loader').classList.add('done')));
// Builders in their rest pose, used by tools/export to write the sellable model files.
const BUILDERS = {
  madako: () => makeOctopus(),
  agohaze: () => makeFish(GOBY),
  isogani: () => makeCrab(),
  yadokari: () => makeHermit(),
  umeboshi_open: () => { const a = makeAnemone(); poseAnemone(a, 1); return a; },
  umeboshi_closed: () => { const a = makeAnemone(); poseAnemone(a, 0); return a; },
  uni: () => makeUrchin(),
  hitode: () => makeStar(),
  mejina: () => makeFish(MEJINA),
};
window.__tidal = {
  THREE, BUILDERS, mergeGeometries,
  get tn() { return tn; }, set tn(v) { tn = v; },
  get hour() { return hour; }, set hour(v) { hour = v; dayUiTimer = 0; },
  select: (k) => select(inds.find(i => i.species === k), true),
  goView, flip: flipWorld,
  get side() { return side; },
  jump() { if (flipAnim) { flipGroup.rotation.z = flipAnim.to; flipAnim = null; $('flip').disabled = false; } if (camAnim) { camera.position.copy(camAnim.p1); controls.target.copy(camAnim.t1); camAnim = null; } if (tideAnim) { tn = tideAnim.to; tideAnim = null; } },
};
</script>
